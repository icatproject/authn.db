# Logging settings
quarkus.log.level=INFO
quarkus.log.category."org.icatproject.authn_db".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# DB settings
quarkus.datasource.username = admin
quarkus.datasource.password = admin
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/authn_db
quarkus.datasource.db-version=5.5.0
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Option to set the name of the authenticator, doesn't change the auth mechanism!
#mechanism = db

# Allowed IPs, example:
#ip = 130.246.0.0/16 192.168.0.1/24